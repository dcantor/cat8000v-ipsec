# Lab settings — sourced by lab.sh
LAB_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
LIBVIRT_URI="qemu:///system"

C8000V_IMAGE="$LAB_DIR/c8000v-universalk9_16G_serial.17.15.06.qcow2"
C8000V_VCPU=2
C8000V_RAM_MIB=4096
# VyOS firewalls (one per headend site, between the headend and its spokes): base image built once from the
# rolling ISO (tools/vyos_install.py), overlays per node; console day-0 from nodes/<fw>/vyos_config.txt
VYOS_IMAGE="$LAB_DIR/images/vyos-base.qcow2"
VYOS_VCPU=1
VYOS_RAM_MIB=1024
# LAN hosts: one small Alpine VM behind every router (eth0 = OOB, eth1 = the router's LAN port), the same base image the
# srv6-core lab builds (tools/build_host_image.sh there): iperf3, tcpdump, mtr, node-exporter, user lab / lab
HOST_IMAGE="$HOME/srv6-core/images/alpine-host.qcow2"
HOST_VCPU=1
HOST_RAM_MIB=256

# OOB management network (libvirt bridge, host is 10.2.0.1; the shared NMS/Nautobot joins as 10.2.0.10)
OOB_NET="ipsec-oob"
OOB_GATEWAY="10.2.0.1"

# hub with one point-to-point WAN link per spoke (UDP tunnels between the VMs, no shared segment)
declare -A ROLE=(    [east-headend]=hub          [spoke1]=spoke     [spoke2]=spoke [spoke3]=spoke [central-headend]=hub [spoke4]=spoke [west-headend]=hub [fw-east]=firewall [fw-central]=firewall [fw-west]=firewall
                     [host-east]=host [host-central]=host [host-west]=host [host-spoke1]=host [host-spoke2]=host [host-spoke3]=host [host-spoke4]=host )
declare -A MGMT_IP=( [east-headend]=10.2.0.11    [spoke1]=10.2.0.12 [spoke2]=10.2.0.13 [spoke3]=10.2.0.14 [central-headend]=10.2.0.15 [spoke4]=10.2.0.16 [west-headend]=10.2.0.17 [fw-east]=10.2.0.21 [fw-central]=10.2.0.22 [fw-west]=10.2.0.23
                     [host-east]=10.2.0.31 [host-central]=10.2.0.32 [host-west]=10.2.0.33 [host-spoke1]=10.2.0.34 [host-spoke2]=10.2.0.35 [host-spoke3]=10.2.0.36 [host-spoke4]=10.2.0.37 )
declare -A BGP_AS=(  [east-headend]=65200        [spoke1]=65201     [spoke2]=65202 [spoke3]=65203 [central-headend]=65204 [spoke4]=65205 [west-headend]=65206 [fw-east]=- [fw-central]=- [fw-west]=-
                     [host-east]=- [host-central]=- [host-west]=- [host-spoke1]=- [host-spoke2]=- [host-spoke3]=- [host-spoke4]=- )
# the site LAN /24 of every router: its LAN port (GigabitEthernet$SPOKE_LAN_PORT / $HUB_LAN_PORT) holds .1, the host behind it .2
declare -A LAN=(     [east-headend]=192.168.11.0/24 [spoke1]=192.168.12.0/24 [spoke2]=192.168.23.0/24 [spoke3]=192.168.13.0/24 [central-headend]=192.168.14.0/24 [spoke4]=192.168.15.0/24 [west-headend]=192.168.16.0/24 [fw-east]=- [fw-central]=- [fw-west]=-
                     [host-east]=- [host-central]=- [host-west]=- [host-spoke1]=- [host-spoke2]=- [host-spoke3]=- [host-spoke4]=- )
# WAN links: "node:port node:port  prefix"; first end gets .1, second .2. The first end anchors the UDP socket pair.
# Firewalls are always the first end: eth1 <-> its headend's Gi2 (the headend's WAN / tunnel source), eth2.. <-> spokes.
# (port = GigabitEthernet number on routers, ethN number on firewalls)
LINKS=(
  "fw-east:1 east-headend:2 100.64.1.0/30"
  "fw-central:1 central-headend:2 100.64.2.0/30"
  "fw-west:1 west-headend:2 100.64.3.0/30"
  "fw-east:2 spoke1:2 100.65.1.0/30"
  "fw-east:4 spoke3:2 100.65.3.0/30"
  "fw-central:2 spoke1:3 100.65.4.0/30"
  "fw-central:3 spoke2:3 100.65.5.0/30"
  "fw-central:4 spoke3:3 100.65.6.0/30"
  "fw-central:5 spoke4:2 100.65.7.0/30"
  "fw-west:3 spoke2:4 100.65.9.0/30"
  "fw-west:4 spoke3:4 100.65.10.0/30"
  "fw-west:5 spoke4:3 100.65.11.0/30"
  "fw-east:3 spoke4:4 100.65.2.0/30"
  # LAN links: the router's LAN port (.1, the site LAN /24) <-> its host's eth1 (.2)
  "east-headend:9 host-east:1 192.168.11.0/24"
  "central-headend:9 host-central:1 192.168.14.0/24"
  "west-headend:9 host-west:1 192.168.16.0/24"
  "spoke1:5 host-spoke1:1 192.168.12.0/24"
  "spoke2:5 host-spoke2:1 192.168.23.0/24"
  "spoke3:5 host-spoke3:1 192.168.13.0/24"
  "spoke4:5 host-spoke4:1 192.168.15.0/24"
)
# IPsec VTI tunnels over those links: "hub-tunnel spoke tunnel-prefix"
TUNNELS=(
  "1 east-headend spoke1 172.17.1.0/30"
  "3 east-headend spoke3 172.17.3.0/30"
  "4 central-headend spoke1 172.17.4.0/30"
  "5 central-headend spoke2 172.17.5.0/30"
  "6 central-headend spoke3 172.17.6.0/30"
  "7 central-headend spoke4 172.17.7.0/30"
  "9 west-headend spoke2 172.17.9.0/30"
  "10 west-headend spoke3 172.17.10.0/30"
  "11 west-headend spoke4 172.17.11.0/30"
  "2 east-headend spoke4 172.17.2.0/30"
)

declare -A CONSOLE_PORT=( [east-headend]=5201 [spoke1]=5202 [spoke2]=5203 [spoke3]=5204 [central-headend]=5205 [spoke4]=5206 [west-headend]=5207 [fw-east]=5209 [fw-central]=5210 [fw-west]=5211
                          [host-east]=5212 [host-central]=5213 [host-west]=5214 [host-spoke1]=5215 [host-spoke2]=5216 [host-spoke3]=5217 [host-spoke4]=5218 )
declare -A NODE_IDX=( [east-headend]=1 [spoke1]=2 [spoke2]=3 [spoke3]=4 [central-headend]=5 [spoke4]=6 [west-headend]=7 [fw-east]=9 [fw-central]=10 [fw-west]=11
                      [host-east]=12 [host-central]=13 [host-west]=14 [host-spoke1]=15 [host-spoke2]=16 [host-spoke3]=17 [host-spoke4]=18 )      # MACs 52:54:00:c7:<idx>:<port> (hex), UDP ports 22000+idx*100+port
MAC_OUI="52:54:00:c7"
UDP_BASE=22000
# spoke-facing ports: the hub has Gi2..Gi(1+HUB_PORTS) so spokes can be added without touching the hub VM;
# a link's UDP socket pair is anchored on its first end (the hub), so the hub's definition never changes
HUB_PORTS=8
SPOKE_PORTS=4
FW_PORTS=8        # eth1 = headend side, eth2..eth8 = up to 7 spokes per headend
# internet breakout: every firewall's eth$FW_INTERNET_PORT sits on the libvirt NAT network (DHCP) and masquerades the site LANs;
# the headend behind it advertises a default route to its spokes (nearest headend preferred) — see lab-intent.json `internet`
FW_INTERNET_PORT=9
INTERNET_NET=default
HUB_LAN_PORT=9    # the last port of a router is its site LAN (the host VM hangs off it; the LAN /24 is advertised whether or not a host is attached)
SPOKE_LAN_PORT=5
HOST_PORTS=1      # eth1 = the LAN

ROUTERS=(east-headend spoke1 spoke2 spoke3 central-headend spoke4 west-headend)
HOSTS=(host-east host-central host-west host-spoke1 host-spoke2 host-spoke3 host-spoke4)
ALL_NODES=(east-headend spoke1 spoke2 spoke3 central-headend spoke4 west-headend fw-east fw-central fw-west host-east host-central host-west host-spoke1 host-spoke2 host-spoke3 host-spoke4)
