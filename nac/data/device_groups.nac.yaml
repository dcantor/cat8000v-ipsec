---
# Everything about the VPN is GENERATED from Nautobot into devices.nac.yaml: VTI tunnels
# (custom fields + relationships on TunnelN), the IKEv2/IPsec suite (config context "crypto"),
# WAN addresses, loopbacks and eBGP. Only the pre-shared key lives here.
iosxe:
  device_groups:
    - name: IPSEC_VPN
      devices: [hub, spoke1, spoke2]
      variables:
        vpn_psk: cisco123
