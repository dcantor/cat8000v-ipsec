  - name: DCI
    host: 10.2.0.19
    protocol: restconf
    device_groups:
    - IPSEC_VPN
    templates:
    - nat_DCI_1
    - nat_DCI_2
    - nat_DCI_3
    - nat_DCI_4
    - nat_DCI_5
    - nat_DCI_6
    variables:
      router_id: 10.255.1.8
      bgp_asn: 65208
    configuration:
      system:
        hostname: DCI
        ip_domain_name: lab.local
      interfaces:
        ethernets:
        - type: GigabitEthernet
          id: '2'
          description: WAN to west-headend GigabitEthernet3
          shutdown: false
          cdp: true
          ipv4:
            address: 100.64.20.2
            address_mask: 255.255.255.252
            nat_outside: true
        - type: GigabitEthernet
          id: '3'
          description: WAN to ACME-acquisition GigabitEthernet2
          shutdown: false
          cdp: true
          ipv4:
            address: 100.64.21.1
            address_mask: 255.255.255.252
            nat_inside: true
        - type: GigabitEthernet
          id: '4'
          shutdown: true
        - type: GigabitEthernet
          id: '5'
          description: site LAN 192.168.31.0/24 (no host)
          shutdown: false
          cdp: true
          ipv4:
            address: 192.168.31.1
            address_mask: 255.255.255.0
        loopbacks:
        - id: 0
          description: Router ID
          ipv4:
            address: 10.255.1.8
            address_mask: 255.255.255.255
        tunnels: []
      prefix_lists:
      - name: OVERLAP
        description: 'prefixes that exist on both sides of the DCI: translated, not advertised'
        seqs:
        - seq: 5
          action: permit
          prefix: 192.168.12.0/24
        - seq: 10
          action: permit
          prefix: 10.128.0.0/14
      route_maps:
      - name: NO-OVERLAP
        entries:
        - seq: 10
          operation: deny
          description: the overlapping prefixes stay on their own side of the NAT
          match:
            ipv4_address_prefix_lists:
            - OVERLAP
        - seq: 20
          operation: permit
          description: everything else is advertised normally
      routing:
        bgp:
          as_number: 65208
          router_id: 10.255.1.8
          log_neighbor_changes: true
          neighbors:
          - ip: 100.64.20.1
            remote_as: 65206
            description: eBGP west-headend (100.64.20.0/30)
          - ip: 100.64.21.2
            remote_as: 65209
            description: eBGP ACME-acquisition (100.64.21.0/30)
          address_family:
            ipv4_unicast:
              neighbors:
              - ip: 100.64.20.1
                activate: true
                route_maps:
                - direction: out
                  name: NO-OVERLAP
                - direction: in
                  name: NO-OVERLAP
              - ip: 100.64.21.2
                activate: true
                route_maps:
                - direction: out
                  name: NO-OVERLAP
              networks:
              - network: 10.255.1.8
                mask: 255.255.255.255
              - network: 100.96.0.0
                mask: 255.252.0.0
              - network: 100.100.0.0
                mask: 255.252.0.0
              - network: 172.30.12.0
                mask: 255.255.255.0
              - network: 172.31.12.0
                mask: 255.255.255.0
              - network: 192.168.31.0
        static_routes:
        - prefix: 172.31.12.0
          mask: 255.255.255.0
          next_hops:
          - interface_type: 'Null'
            interface_id: '0'
            name: nat-inside-global
        - prefix: 172.30.12.0
          mask: 255.255.255.0
          next_hops:
          - ip: 100.64.20.1
            name: nat-outside-local
        - prefix: 100.96.0.0
          mask: 255.252.0.0
          next_hops:
          - interface_type: 'Null'
