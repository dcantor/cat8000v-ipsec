    templates:
    - dns_ACME-acquisition_1
    - dns_ACME-acquisition_2
    - dns_ACME-acquisition_3
    - scale_overlap_ACME-acquisition_1
    - scale_overlap_ACME-acquisition_2
    - scale_overlap_ACME-acquisition_3
    - dns_client_ACME-acquisition
    variables:
      router_id: 10.255.1.9
      bgp_asn: 65209
    configuration:
      system:
        hostname: ACME-acquisition
        ip_domain_name: lab.local
        ip_domain_lookup: true
      interfaces:
        ethernets:
        - type: GigabitEthernet
          id: '2'
          description: WAN to DCI GigabitEthernet3
          shutdown: false
          cdp: true
          ipv4:
            address: 100.64.21.2
            address_mask: 255.255.255.252
        - type: GigabitEthernet
          id: '3'
          shutdown: true
        - type: GigabitEthernet
          id: '4'
          shutdown: true
        - type: GigabitEthernet
          id: '5'
          description: site LAN 192.168.30.0/24 (host-acquisition eth1)
          shutdown: false
          cdp: true
          ipv4:
            address: 192.168.30.1
            address_mask: 255.255.255.0
        loopbacks:
        - id: 0
          description: Router ID
          ipv4:
            address: 10.255.1.9
            address_mask: 255.255.255.255
        - id: 1
          description: acquisition services
          ipv4:
            address: 10.60.0.1
            address_mask: 255.255.255.0
        - id: 2
          description: acquisition server on an overlapping prefix (same address as ACME's host-spoke1)
          ipv4:
            address: 192.168.12.2
            address_mask: 255.255.255.0
        tunnels: []
      routing:
        bgp:
          as_number: 65209
          router_id: 10.255.1.9
          log_neighbor_changes: true
          neighbors:
          - ip: 100.64.21.1
            remote_as: 65208
            description: eBGP DCI (100.64.21.0/30)
          address_family:
            ipv4_unicast:
              neighbors:
              - ip: 100.64.21.1
                activate: true
              networks:
              - network: 10.255.1.9
                mask: 255.255.255.255
              - network: 10.60.0.0
                mask: 255.255.255.0
              - network: 10.128.0.0
