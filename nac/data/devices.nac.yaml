  - name: central-headend
    host: 10.2.0.15
    protocol: restconf
    device_groups:
    - IPSEC_VPN
    templates:
    - mss_central-headend_tunnel4
    - mss_central-headend_tunnel5
    - mss_central-headend_tunnel6
    - mss_central-headend_tunnel7
    - ikev2_cert_auth_central-headend
    variables:
      router_id: 10.255.1.5
      bgp_asn: 65204
    configuration:
      system:
        hostname: central-headend
        ip_domain_name: lab.local
      crypto:
        ikev2:
          proposals:
          - name: VPN-PROP
            encryption:
            - aes_cbc_256
            integrity:
            - sha256
            group:
            - '14'
          policies:
          - name: VPN-POL
            proposals:
            - VPN-PROP
          keyrings:
          - name: VPN-KEYRING
            peers:
            - name: spoke2
              ipv4_address: 100.65.5.2
              ipv4_mask: 255.255.255.255
              pre_shared_key: ${psk_spoke2}
            - name: spoke3
              ipv4_address: 100.65.6.2
              ipv4_mask: 255.255.255.255
              pre_shared_key: ${psk_spoke3}
          profiles:
          - name: VPN-IKEV2
            dpd_interval: 20
            dpd_retry: 3
            dpd_query: on-demand
          - name: VPN-IKEV2-PSK
            match_identity_remote_ipv4_addresses:
            - address: 100.65.5.2
              mask: 255.255.255.255
            - address: 100.65.6.2
              mask: 255.255.255.255
            authentication_local_pre_share: true
            authentication_remote_pre_share: true
            keyring_local: VPN-KEYRING
            dpd_interval: 20
            dpd_retry: 3
            dpd_query: on-demand
        ipsec_transform_sets:
        - name: VPN-TS
          esp: esp-256-aes
          esp_hmac: esp-sha256-hmac
        ipsec_profiles:
        - name: VPN-IPSEC
          set_transform_set:
          - VPN-TS
          set_ikev2_profile: VPN-IKEV2
        - name: VPN-IPSEC-PSK
          set_transform_set:
          - VPN-TS
          set_ikev2_profile: VPN-IKEV2-PSK
      interfaces:
        ethernets:
        - type: GigabitEthernet
          id: '2'
          description: WAN to fw-central eth1
          shutdown: false
          cdp: true
          ipv4:
            address: 100.64.2.2
